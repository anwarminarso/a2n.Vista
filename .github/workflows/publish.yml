name: publish

# Publishes the implemented Vista packages to nuget.org via Trusted Publishing (OIDC):
# GitHub issues a short-lived OIDC token, NuGet/login exchanges it for a temporary
# (~1 hour) API key, and the packages are pushed. No long-lived API key is stored.
#
# NuGet Trusted Publishing policy (nuget.org -> Trusted Publishing) must reference this
# file by name: Workflow File = "publish.yml".
#
# Runs on a published GitHub Release (the tag drives the package version, e.g. v1.2.3),
# or manually via workflow_dispatch with an explicit version.
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (e.g. 1.2.3)."
        required: true
        type: string

permissions:
  contents: read      # checkout
  id-token: write     # request the GitHub OIDC token for NuGet Trusted Publishing

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_FEED: "https://api.nuget.org/v3/index.json"
  # Only the implemented, shippable libraries. Intentionally excluded:
  #   * the empty scaffolds (a2n.Vista.Newtonsoft + the MudBlazor/OData/GraphQL/
  #     PrimeNG/Syncfusion/TanStackTable/Telerik adapters) until they have content;
  #   * a2n.Vista.SourceGenerators - NOT shipped standalone. It is bundled into the
  #     a2n.Vista.Core package (packed under analyzers/dotnet/cs) so consumers get the
  #     generator transitively; packing it on its own would emit an empty package
  #     (IncludeBuildOutput=false).
  PACK_PROJECTS: >-
    src/a2n.Vista.Core/a2n.Vista.Core.csproj
    src/a2n.Vista.EntityFrameworkCore/a2n.Vista.EntityFrameworkCore.csproj
    src/a2n.Vista.AspNetCore/a2n.Vista.AspNetCore.csproj
    src/a2n.Vista.OpenApi/a2n.Vista.OpenApi.csproj
    src/Adapters/a2n.Vista.EntityFrameworkCore.Npgsql/a2n.Vista.EntityFrameworkCore.Npgsql.csproj
    src/Adapters/a2n.Vista.Adapters.DataTablesNet/a2n.Vista.Adapters.DataTablesNet.csproj
    src/Adapters/a2n.Vista.Adapters.AgGrid/a2n.Vista.Adapters.AgGrid.csproj
    src/a2n.Vista.Client.TypeScript/a2n.Vista.Client.TypeScript.csproj

jobs:
  # Release gate. `ci.yml` runs the suites on push/pull_request to main, but a `release:
  # published` event publishes whatever the tag points at — so without this job nothing in the
  # release path verifies that the tagged commit's tests pass, and a NuGet version is immutable
  # once pushed. The whole correctness discipline of this project rests on these suites (the
  # generated-vs-reflection parity guards in particular), so the release path must not skip them.
  # Mirrors ci.yml's matrix; a release is rare enough that running all three TFMs is cheap.
  test:
    name: Test (${{ matrix.tfm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tfm: [ net8.0, net9.0, net10.0 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # TUnit runs on Microsoft.Testing.Platform: each test project compiles to an executable and
      # is launched via `dotnet run --framework <tfm>` (not `dotnet test`), matching the repo
      # convention. A non-zero exit code fails the step and blocks the publish job.
      - name: a2n.Vista.Tests
        run: dotnet run --project src/Tests/a2n.Vista.Tests -c Release --framework ${{ matrix.tfm }}

      - name: a2n.Vista.SourceGenerators.Tests
        run: dotnet run --project src/Tests/a2n.Vista.SourceGenerators.Tests -c Release --framework ${{ matrix.tfm }}

      - name: a2n.Vista.Client.TypeScript.Tests
        run: dotnet run --project src/Tests/a2n.Vista.Client.TypeScript.Tests -c Release --framework ${{ matrix.tfm }}

  publish:
    name: Pack & push to nuget.org
    needs: test
    runs-on: ubuntu-latest
    # The NUGET_USER secret lives in the "nuget" GitHub Environment, so the job must
    # be scoped to it to read the secret (and to benefit from any environment
    # protection rules). The OIDC token's subject then carries this environment.
    environment: nuget
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Determine version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${{ github.event.release.tag_name }}"
          else
            v="${{ inputs.version }}"
          fi
          v="${v#v}"   # strip an optional leading "v" (v1.2.3 -> 1.2.3)
          if [ -z "$v" ]; then
            echo "::error::No version resolved from the release tag or the dispatch input."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publishing version $v"

      - name: Restore
        run: dotnet restore src/a2n.Vista.slnx

      - name: Build (Release)
        run: dotnet build src/a2n.Vista.slnx -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for proj in $PACK_PROJECTS; do
            echo "==> packing $proj"
            dotnet pack "$proj" -c Release --no-build -o artifacts \
              -p:Version=${{ steps.ver.outputs.version }}
          done
          ls -l artifacts

      # Fail loudly rather than pushing a package with no license declaration. The project is
      # LGPL-3.0-or-later and `dotnet pack` omits license metadata SILENTLY when it is unset, so a
      # regression here would otherwise reach nuget.org unnoticed — and a consumer cannot honour
      # terms a package never declares.
      - name: Verify package metadata (license + symbols)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for pkg in artifacts/*.nupkg; do
            name="$(basename "$pkg")"
            if ! unzip -p "$pkg" '*.nuspec' | grep -q '<license type="expression">LGPL-3.0-or-later</license>'; then
              echo "::error::$name declares no LGPL-3.0-or-later license expression."
              missing=1
            fi
            if [ ! -f "${pkg%.nupkg}.snupkg" ]; then
              echo "::error::$name has no matching .snupkg symbol package."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "All packages carry a license expression and a symbol package."
          exit "$missing"

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org account/profile name that owns the Trusted Publishing policy
          # (NOT an email). Stored as a repository secret.
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source ${{ env.NUGET_FEED }}
          --skip-duplicate
